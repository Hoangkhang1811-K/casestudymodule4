<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quản lý danh mục — Mộc Nhiên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments :: header}"></div>
    <main class="page-wrap">
      <div class="page-heading">
        <div>
          <span class="eyebrow">KHÔNG GIAN QUẢN TRỊ</span>
          <h1>Danh <em>mục.</em></h1>
        </div>
      </div>
      <nav class="admin-tabs">
        <a th:href="@{/admin/products}">Sản phẩm</a
        ><a class="active" th:href="@{/admin/categories}">Danh mục</a
        ><a th:href="@{/admin/users}">Người dùng</a><a th:href="@{/admin/orders}">Đơn hàng</a>
        <a th:href="@{/admin/reports}">Báo cáo</a>
      </nav>
      <div class="admin-two-column">
        <section class="profile-form-card">
          <h3>Thêm danh mục mới</h3>
          <form class="form-stack" th:action="@{/admin/categories}" method="post">
            <label
              >Tên danh mục<input
                name="name"
                required
                maxlength="80"
                placeholder="Ví dụ: Đồ gốm" /></label
            ><label>Biểu tượng<input name="icon" maxlength="8" value="✦" /></label
            ><button class="button button-dark">Thêm danh mục ↗</button>
          </form>
        </section>
        <section class="category-list">
          <article th:each="category : ${categories}">
            <span th:text="${category.icon}">✦</span><b th:text="${category.name}">Trang trí</b
            ><small th:text="|Mã #${category.id}|">Mã #1</small>
          </article>
        </section>
      </div>
    </main>
    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
