<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quản lý người dùng — Mộc Nhiên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments :: header}"></div>
    <main class="page-wrap">
      <div class="page-heading">
        <div>
          <span class="eyebrow">KHÔNG GIAN QUẢN TRỊ</span>
          <h1>Thành viên <em>Mộc Nhiên.</em></h1>
        </div>
      </div>
      <nav class="admin-tabs">
        <a th:href="@{/admin/products}">Sản phẩm</a><a th:href="@{/admin/categories}">Danh mục</a
        ><a class="active" th:href="@{/admin/users}">Người dùng</a
        ><a th:href="@{/admin/orders}">Đơn hàng</a>
        <a th:href="@{/admin/reports}">Báo cáo</a>
      </nav>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Thành viên</th>
              <th>Email</th>
              <th>Vai trò</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${users}">
              <td>
                <div class="table-user">
                  <span class="profile-avatar" th:text="${#strings.substring(user.fullName,0,1)}"
                    >A</span
                  >
                  <div>
                    <b th:text="${user.fullName}">Người dùng</b
                    ><small th:text="|@${user.username}|">@user</small>
                  </div>
                </div>
              </td>
              <td th:text="${user.email}">user@email.com</td>
              <td><span class="member-pill" th:text="${user.role}">USER</span></td>
              <td>
                <span class="status-pill" th:text="${user.enabled ? 'Đang hoạt động' : 'Đã khóa'}"
                  >Đang hoạt động</span
                >
              </td>
              <td>
                <form
                  th:if="${user.role != 'ADMIN'}"
                  th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                  method="post"
                >
                  <input type="hidden" name="enabled" th:value="${!user.enabled}" /><button
                    class="danger-link"
                    th:text="${user.enabled ? 'Khóa tài khoản' : 'Mở khóa'}"
                    data-confirm="Thay đổi trạng thái tài khoản này?"
                  >
                    Khóa
                  </button>
                </form>
                <span th:if="${user.role == 'ADMIN'}" class="muted-text">Không thể khóa</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <div th:replace="~{fragments :: footer}"></div>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
